<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CYBER TIMER">
  <meta name="theme-color" content="#000000">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-180.png">
  <title>CYBER TIMER</title>
  <style>
    :root {
      --bg:#000;
      --fg:#fff;
      --muted:#8a8a8a;
      --line:#fff;
      --panel:#0b0b0b;
      --accent:#fff;
    }
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html,body { margin:0; width:100%; height:100%; overflow:hidden; background:var(--bg); color:var(--fg); }
    body {
      font-family:"Courier New", Courier, monospace;
      font-weight:700;
      -webkit-font-smoothing:none;
      text-rendering:geometricPrecision;
    }
    button, select { font:inherit; color:inherit; }
    button { border:0; background:none; padding:0; }
    .screen { position:fixed; inset:0; display:none; }
    .screen.active { display:flex; }

    /* SETUP */
    #setup {
      flex-direction:column;
      padding:18px 24px 20px;
      background:var(--bg);
    }
    .setup-head {
      display:flex; align-items:center; justify-content:space-between;
      min-height:42px; border-bottom:2px solid var(--line);
      margin-bottom:18px;
    }
    .brand { font-size:20px; letter-spacing:3px; }
    .theme-btn {
      width:46px; height:38px; border:2px solid var(--line);
      display:flex; align-items:center; justify-content:center;
      font-size:21px; cursor:pointer;
    }
    .sun-icon, .moon-icon {
      width:18px; height:18px; position:relative; display:block;
    }
    .moon-icon { border:2px solid currentColor; border-radius:50%; border-left-color:transparent; transform:rotate(-35deg); }
    .sun-icon { border:2px solid currentColor; border-radius:50%; }
    .sun-icon:before, .sun-icon:after {
      content:""; position:absolute; left:50%; top:50%; width:26px; height:2px;
      background:currentColor; transform:translate(-50%,-50%);
      box-shadow:0 -10px 0 -0.5px currentColor, 0 10px 0 -0.5px currentColor;
    }
    .sun-icon:after { transform:translate(-50%,-50%) rotate(45deg); box-shadow:0 -10px 0 -0.5px currentColor, 0 10px 0 -0.5px currentColor; }

    .fields {
      flex:1; display:grid; grid-template-columns:repeat(4,1fr);
      gap:12px; align-items:stretch; min-height:0;
    }
    .field {
      border:2px solid var(--line); display:flex; flex-direction:column;
      justify-content:space-between; min-width:0; padding:14px 10px 10px;
      background:var(--panel);
    }
    .field-label { font-size:17px; letter-spacing:1px; }
    .field-value {
      display:grid; grid-template-columns:1fr 1fr; gap:8px; align-items:end;
    }
    .field.round .field-value { grid-template-columns:1fr; }
    select {
      width:100%; min-width:0; appearance:auto;
      background:var(--bg); color:var(--fg); border:2px solid var(--line);
      border-radius:0; padding:10px 4px; font-size:26px; text-align:center;
      height:58px;
    }
    .colon { font-size:28px; text-align:center; align-self:center; }
    .unit { font-size:12px; color:var(--muted); margin-top:7px; letter-spacing:1px; }
    #startBtn {
      margin-top:14px; height:74px; border:3px solid var(--line);
      background:var(--fg); color:var(--bg); font-size:28px; letter-spacing:3px;
      cursor:pointer;
    }
    #startBtn:active, .theme-btn:active { transform:scale(.985); }

    /* TIMER */
    #timer { flex-direction:column; background:var(--bg); }
    .timer-top {
      flex:0 0 18%; min-height:0; display:flex; align-items:flex-end;
      justify-content:center; padding:10px 24px 5px; border-bottom:2px solid var(--line);
    }
    #phase {
      font-size:38px; line-height:1;
      letter-spacing:3px; text-align:center; max-width:100%;
      overflow:hidden; white-space:nowrap;
    }
    #clockZone {
      flex:1; min-height:0; display:flex; align-items:center; justify-content:center;
      position:relative; cursor:pointer; user-select:none;
      -webkit-user-select:none;
    }
    #clock {
      width:100%; text-align:center;
      font-size:22vw;
      line-height:.88; letter-spacing:-7px;
      font-variant-numeric:tabular-nums;
      transform:scaleY(1.05);
      text-shadow:3px 0 0 var(--fg), -3px 0 0 var(--fg), 0 3px 0 var(--fg), 0 -3px 0 var(--fg);
    }
    #clock.paused { opacity:.45; }
    .pixel-break {
      position:absolute; left:0; right:0; top:50%; height:8px; pointer-events:none;
      background:repeating-linear-gradient(90deg, transparent 0 9px, var(--bg) 9px 13px);
      mix-blend-mode:normal; opacity:.55;
    }
    .timer-bottom {
      flex:0 0 18%; min-height:0; display:flex; flex-direction:column;
      justify-content:flex-end;
    }
    #progressTrack { width:100%; height:14px; border-top:2px solid var(--line); background:var(--bg); }
    #progressBar { height:100%; width:0%; background:var(--fg); }
    .timer-controls {
      height:58px; display:flex; justify-content:space-between; align-items:center;
      padding:0 18px;
    }
    .small-btn {
      border:2px solid var(--line); height:42px; min-width:110px; padding:0 12px;
      font-size:15px; letter-spacing:1px;
    }
    #status { font-size:13px; letter-spacing:1px; color:var(--muted); text-align:center; }
    .invert {
      --bg:#fff; --fg:#000; --muted:#555; --line:#000; --panel:#f1f1f1;
    }

    @media (orientation:portrait) {
      body:after {
        content:"RUOTA L'IPAD IN ORIZZONTALE";
        position:fixed; inset:0; z-index:9999; background:#000; color:#fff;
        display:flex; align-items:center; justify-content:center; text-align:center;
        font-size:24px; padding:30px;
      }
    }
  </style>
</head>
<body>
  <section id="setup" class="screen active">
    <div class="setup-head">
      <div class="brand">CYBER TIMER</div>
      <button id="themeBtn" class="theme-btn" aria-label="Cambia tema"><span class="moon-icon"></span></button>
    </div>

    <div class="fields">
      <div class="field">
        <div class="field-label">WARM UP</div>
        <div>
          <div class="field-value">
            <select id="wuM"></select><div class="colon">:</div><select id="wuS"></select>
          </div>
          <div class="unit">MM : SS</div>
        </div>
      </div>
      <div class="field">
        <div class="field-label">WORK</div>
        <div>
          <div class="field-value">
            <select id="workM"></select><div class="colon">:</div><select id="workS"></select>
          </div>
          <div class="unit">MM : SS</div>
        </div>
      </div>
      <div class="field">
        <div class="field-label">REST</div>
        <div>
          <div class="field-value">
            <select id="restM"></select><div class="colon">:</div><select id="restS"></select>
          </div>
          <div class="unit">MM : SS</div>
        </div>
      </div>
      <div class="field round">
        <div class="field-label">ROUND</div>
        <div>
          <div class="field-value"><select id="rounds"></select></div>
          <div class="unit">REPETITIONS</div>
        </div>
      </div>
    </div>
    <button id="startBtn">START</button>
  </section>

  <section id="timer" class="screen">
    <div class="timer-top"><div id="phase">READY</div></div>
    <div id="clockZone" aria-label="Pausa o riprendi">
      <div id="clock">00:00</div>
      <div class="pixel-break"></div>
    </div>
    <div class="timer-bottom">
      <div id="progressTrack"><div id="progressBar"></div></div>
      <div class="timer-controls">
        <button id="resetBtn" class="small-btn">RESET</button>
        <div id="status">TAP CENTRE = PAUSE</div>
        <button id="themeBtnTimer" class="small-btn" aria-label="Cambia tema"><span class="moon-icon"></span></button>
      </div>
    </div>
  </section>

<script>
(function () {
  "use strict";

  var $ = function(id){ return document.getElementById(id); };
  var root = document.documentElement;
  var setup = $("setup"), timer = $("timer");
  var phase = $("phase"), clock = $("clock"), progress = $("progressBar"), status = $("status");
  var timerId = null, audioCtx = null, paused = false, running = false;
  var phaseIndex = 0, roundIndex = 1, remainingMs = 0, phaseTotalMs = 0, lastTick = 0;

  function fillSelect(id, max, selected) {
    var el = $(id), html = "", i, label;
    for (i=0; i<=max; i++) {
      label = i < 10 ? "0" + i : "" + i;
      html += '<option value="' + i + '"' + (i === selected ? " selected" : "") + '>' + label + '</option>';
    }
    el.innerHTML = html;
  }
  function fillRounds() {
    var el = $("rounds"), html = "", i;
    for (i=1;i<=99;i++) html += '<option value="'+i+'"'+(i===6?" selected":"")+'>'+i+'</option>';
    el.innerHTML = html;
  }
  fillSelect("wuM",59,0); fillSelect("wuS",59,30);
  fillSelect("workM",59,1); fillSelect("workS",59,0);
  fillSelect("restM",59,30); fillSelect("restS",59,0);
  fillRounds();

  function themeIcon(el) {
    el.innerHTML = root.className.indexOf("invert") >= 0 ? '<span class="sun-icon"></span>' : '<span class="moon-icon"></span>';
  }
  function toggleTheme() {
    root.className = root.className.indexOf("invert") >= 0 ? "" : "invert";
    themeIcon($("themeBtn")); themeIcon($("themeBtnTimer"));
    try { localStorage.setItem("cyberTheme", root.className); } catch(e) {}
  }
  try { if (localStorage.getItem("cyberTheme") === "invert") root.className="invert"; } catch(e) {}
  themeIcon($("themeBtn")); themeIcon($("themeBtnTimer"));
  $("themeBtn").onclick = toggleTheme;
  $("themeBtnTimer").onclick = toggleTheme;

  function value(id) { return parseInt($(id).value,10) || 0; }
  function duration(m,s) { return (m*60+s)*1000; }

  function readSettings() {
    return {
      warm: duration(value("wuM"), value("wuS")),
      work: duration(value("workM"), value("workS")),
      rest: duration(value("restM"), value("restS")),
      rounds: value("rounds")
    };
  }

  function ensureAudio() {
    if (!audioCtx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
  }

  /* Short synthesized alarm: no external audio file, so it works offline. */
  function beep(strong) {
    ensureAudio();
    if (!audioCtx) return;
    var now = audioCtx.currentTime;
    var osc = audioCtx.createOscillator();
    var gain = audioCtx.createGain();
    osc.type = "square";
    osc.frequency.setValueAtTime(strong ? 880 : 660, now);
    osc.frequency.exponentialRampToValueAtTime(strong ? 1320 : 990, now + 0.09);
    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.exponentialRampToValueAtTime(0.7, now + 0.008);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.34);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(now); osc.stop(now + 0.36);
    if (strong) {
      setTimeout(function(){ beep(false); }, 120);
    }
  }

  var settings;
  function buildPhase() {
    var p;
    if (phaseIndex === 0) {
      p = {name:"WARM UP", ms:settings.warm};
    } else if (phaseIndex === 1) {
      p = {name:"WORK " + roundIndex + "/" + settings.rounds, ms:settings.work};
    } else {
      p = {name:"REST " + roundIndex + "/" + settings.rounds, ms:settings.rest};
    }
    return p;
  }

  function nextPhase(initial) {
    var p = buildPhase();
    if (p.ms <= 0) {
      if (phaseIndex === 0) { phaseIndex=1; return nextPhase(initial); }
      if (phaseIndex === 1) {
        if (settings.rounds <= 1) { finish(); return; }
        phaseIndex=2; return nextPhase(initial);
      }
      if (phaseIndex === 2) { roundIndex++; phaseIndex=1; return nextPhase(initial); }
    }
    phase.textContent = p.name;
    phaseTotalMs = p.ms;
    remainingMs = p.ms;
    if (!initial) beep(true);
    updateDisplay();
  }

  function updateDisplay() {
    var sec = Math.max(0, Math.ceil(remainingMs/1000));
    var m = Math.floor(sec/60), s = sec%60;
    var mm = m < 10 ? "0"+m : ""+m, ss = s < 10 ? "0"+s : ""+s;
    clock.textContent = mm + ":" + ss;
    var pct = phaseTotalMs ? (1 - remainingMs/phaseTotalMs) * 100 : 0;
    progress.style.width = Math.max(0, Math.min(100,pct)) + "%";
  }

  function tick(now) {
    if (!running || paused) return;
    if (!lastTick) lastTick = now;
    remainingMs -= (now - lastTick);
    lastTick = now;
    if (remainingMs <= 0) {
      remainingMs = 0; updateDisplay();

      /* Sequence: WARM UP -> WORK -> REST -> WORK...
         The final REST is always skipped. */
      if (phaseIndex === 0) {
        phaseIndex = 1;
        nextPhase(false);
      } else if (phaseIndex === 1) {
        if (roundIndex >= settings.rounds) {
          finish();
          return;
        }
        phaseIndex = 2;
        nextPhase(false);
      } else {
        roundIndex++;
        phaseIndex = 1;
        nextPhase(false);
      }
      return;
    }
    updateDisplay();
    timerId = requestAnimationFrame(tick);
  }

  function start() {
    settings = readSettings();
    if (settings.rounds < 1 || (settings.warm<=0 && settings.work<=0)) return;
    ensureAudio();
    setup.className = "screen";
    timer.className = "screen active";
    running = true; paused = false; phaseIndex=0; roundIndex=1; lastTick=0;
    clock.className = "";
    status.textContent = "TAP CENTRE = PAUSE";
    nextPhase(true);
    timerId = requestAnimationFrame(tick);
  }

  function finish() {
    running = false; paused=false;
    if (timerId) cancelAnimationFrame(timerId);
    timerId=null; remainingMs=0; updateDisplay();
    phase.textContent = "DONE";
    status.textContent = "WORKOUT COMPLETE";
    beep(true);
  }

  function togglePause() {
    if (!running) return;
    paused = !paused;
    clock.className = paused ? "paused" : "";
    status.textContent = paused ? "PAUSED — TAP CENTRE = RESUME" : "TAP CENTRE = PAUSE";
    if (!paused) { ensureAudio(); lastTick=0; timerId=requestAnimationFrame(tick); }
    else if (timerId) { cancelAnimationFrame(timerId); timerId=null; }
  }

  function reset() {
    running=false; paused=false;
    if (timerId) cancelAnimationFrame(timerId);
    timerId=null;
    timer.className="screen"; setup.className="screen active";
  }

  $("startBtn").onclick=start;
  $("clockZone").onclick=togglePause;
  $("resetBtn").onclick=reset;

  /* Keep settings persistent, but only if the browser allows local storage. */
  var ids=["wuM","wuS","workM","workS","restM","restS","rounds"];
  ids.forEach(function(id){
    $(id).onchange=function(){
      try { localStorage.setItem("cyber_"+id, $(id).value); } catch(e){}
    };
    try {
      var v=localStorage.getItem("cyber_"+id);
      if(v!==null) $(id).value=v;
    } catch(e){}
  });
})();
</script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function(){ navigator.serviceWorker.register("sw.js"); });
}
</script>
</body>
</html>
