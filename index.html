<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Gym Timer">
  <meta name="theme-color" content="#f5f3ed">
  <title>Gym Timer</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="setup" class="screen setup-screen">
    <header class="topbar">
      <div class="brand"><span class="brand-mark"></span>GYM TIMER</div>
      <button id="theme-toggle" class="icon-button" type="button" aria-label="Attiva modalità scura">
        <svg class="theme-icon moon-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M20 15.2A8.7 8.7 0 0 1 8.8 4a8.8 8.8 0 1 0 11.2 11.2Z"></path>
        </svg>
        <svg class="theme-icon sun-icon" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="4"></circle>
          <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path>
        </svg>
      </button>
    </header>

    <section class="setup-content">
      <div class="intro">
        <div>
          <p class="eyebrow">INTERVAL TRAINING</p>
          <h1>Prepara il tuo allenamento.</h1>
        </div>
        <p class="hint">Scorri le ruote per impostare tempi e round.</p>
      </div>

      <div class="settings-grid">
        <section class="setting-card">
          <h2>WARM UP</h2>
          <div class="time-wheel" data-setting="warmup" aria-label="Durata warm up"></div>
          <div class="wheel-caption"><span>MIN</span><span>SEC</span></div>
        </section>
        <section class="setting-card accent-card">
          <h2>WORK</h2>
          <div class="time-wheel" data-setting="work" aria-label="Durata work"></div>
          <div class="wheel-caption"><span>MIN</span><span>SEC</span></div>
        </section>
        <section class="setting-card">
          <h2>REST</h2>
          <div class="time-wheel" data-setting="rest" aria-label="Durata rest"></div>
          <div class="wheel-caption"><span>MIN</span><span>SEC</span></div>
        </section>
        <section class="setting-card rounds-card">
          <h2>ROUNDS</h2>
          <div id="rounds-wheel" class="single-wheel" aria-label="Numero di round"></div>
          <div class="wheel-caption single-caption"><span>ROUND</span></div>
        </section>
      </div>

      <div class="start-row">
        <p id="setup-error" class="setup-error" role="alert"></p>
        <button id="start-button" class="start-button" type="button">
          <span>AVVIA</span><span class="start-arrow" aria-hidden="true">→</span>
        </button>
      </div>
    </section>
  </main>

  <main id="timer" class="screen timer-screen" hidden>
    <header class="timer-topbar">
      <div class="brand"><span class="brand-mark"></span>GYM TIMER</div>
      <div id="phase-pill" class="phase-pill">IN CORSO</div>
    </header>
    <section class="timer-content">
      <p id="phase-label" class="phase-label">WARM UP</p>
      <button id="time-display" class="time-display" type="button" aria-label="Metti in pausa">
        <span id="minutes-display">00</span><span class="time-colon">:</span><span id="seconds-display">00</span>
      </button>
      <p id="tap-hint" class="tap-hint">TOCCA IL TEMPO PER METTERE IN PAUSA</p>
      <div id="pause-controls" class="pause-controls" hidden>
        <button id="resume-button" class="resume-button" type="button">RIPRENDI</button>
        <button id="end-button" class="end-button" type="button">TERMINA</button>
      </div>
    </section>
    <div class="progress-track" aria-hidden="true">
      <div id="progress-bar" class="progress-bar"><span class="pixel-edge"></span></div>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
