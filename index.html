:root{--bg:#000;--bg0:rgba(0,0,0,0);--fg:#fff;--dim:#5a5a5a;--faint:#262626;color-scheme:dark;}
html.light,body.light{--bg:#fff;--bg0:rgba(255,255,255,0);--fg:#000;--dim:#a8a8a8;--faint:#e2e2e2;color-scheme:light;}

html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:var(--bg);touch-action:manipulation;}
body{position:fixed;left:0;top:0;right:0;bottom:0;background:var(--bg);color:var(--fg);
  font-family:"Daydream","Silk",Courier,monospace;font-weight:700;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:rgba(0,0,0,0);
  -webkit-text-size-adjust:100%;-webkit-font-smoothing:none;}
button{font-family:inherit;font-weight:700;color:inherit;background:none;border:0;padding:0;margin:0;-webkit-appearance:none;border-radius:0;cursor:pointer;outline:none;}
.hidden{display:none !important;}
.screen{position:absolute;left:0;top:0;right:0;bottom:0;padding-top:20px;padding-top:env(safe-area-inset-top);}
svg.px{shape-rendering:crispEdges;fill:currentColor;display:block;}

/* ---------- icon buttons (theme / sound test) ---------- */
.iconbtn{position:absolute;top:32px;width:64px;height:64px;display:-webkit-box;display:-webkit-flex;display:flex;z-index:10;
  -webkit-box-align:center;-webkit-align-items:center;align-items:center;-webkit-box-pack:center;-webkit-justify-content:center;justify-content:center;z-index:20;}
.iconbtn svg{width:42px;height:42px;}
#themeBtn{right:24px;}
#testBtn{right:96px;}
#modeBtn{left:24px;}
.iconbtn:active{opacity:.4;}

/* ---------- alarm volume panel (opens from the speaker icon) ---------- */
#volShade{position:absolute;left:0;top:0;right:0;bottom:0;z-index:24;}
#volPop{position:absolute;top:100px;right:24px;z-index:25;background:var(--bg);color:var(--fg);border:3px solid var(--fg);
  padding:14px 12px 12px;box-sizing:border-box;text-align:center;}
.volTitle{font-size:14px;line-height:1;font-weight:400;color:var(--dim);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px;white-space:nowrap;}
.volRow{display:-webkit-box;display:-webkit-flex;display:flex;-webkit-box-align:center;-webkit-align-items:center;align-items:center;
  -webkit-box-pack:center;-webkit-justify-content:center;justify-content:center;}
.volBtn{width:52px;height:52px;display:-webkit-box;display:-webkit-flex;display:flex;
  -webkit-box-align:center;-webkit-align-items:center;align-items:center;-webkit-box-pack:center;-webkit-justify-content:center;justify-content:center;}
.volBtn svg{width:28px;height:28px;}
.volBtn:active{opacity:.4;}
.volBtn.off{opacity:.25;}
.volMeter{display:-webkit-box;display:-webkit-flex;display:flex;-webkit-box-align:end;-webkit-align-items:flex-end;align-items:flex-end;
  height:44px;padding:4px 6px;cursor:pointer;outline:none;}
.volMeter i{display:block;width:10px;margin:0 2px;background:var(--faint);}
.volMeter i.on{background:var(--fg);}
.volVal{font-size:18px;line-height:1;margin-top:10px;}

/* ---------- SETUP ---------- */
.setupScreen{display:-webkit-box;display:-webkit-flex;display:flex;-webkit-box-orient:vertical;-webkit-flex-direction:column;flex-direction:column;}
.setupScreen.setup-in{-webkit-animation:setupIn .24s ease-out;animation:setupIn .24s ease-out;}
@-webkit-keyframes setupIn{from{opacity:0;-webkit-transform:translate3d(18px,0,0);}to{opacity:1;-webkit-transform:translate3d(0,0,0);}}
@keyframes setupIn{from{opacity:0;transform:translate3d(18px,0,0);}to{opacity:1;transform:translate3d(0,0,0);}}
.cols{-webkit-box-flex:1;-webkit-flex:1;flex:1;display:-webkit-box;display:-webkit-flex;display:flex;
  -webkit-box-pack:justify;-webkit-justify-content:space-around;justify-content:space-around;
  -webkit-box-align:center;-webkit-align-items:center;align-items:center;padding:70px 24px 0;}
.col{text-align:center;}
.lbl{font-size:30px;line-height:1;margin-bottom:22px;letter-spacing:1px;}
.pair{display:-webkit-box;display:-webkit-flex;display:flex;-webkit-box-align:center;-webkit-align-items:center;align-items:center;-webkit-box-pack:center;-webkit-justify-content:center;justify-content:center;}
.sep{font-size:34px;width:18px;text-align:center;}
.units{display:-webkit-box;display:-webkit-flex;display:flex;-webkit-box-pack:center;-webkit-justify-content:center;justify-content:center;margin-top:12px;font-size:13px;color:var(--dim);font-weight:400;}
.units span{width:88px;text-align:center;}
.units i{width:18px;}

.wbox{position:relative;width:88px;height:280px;}
.wheel{position:absolute;left:0;top:0;width:88px;height:280px;overflow-y:scroll;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;scroll-snap-type:y mandatory;-webkit-scroll-snap-type:y mandatory;}
.wheel::-webkit-scrollbar{display:none;width:0;height:0;}
.wpad{height:112px;}
.it{height:56px;line-height:60px;font-size:38px;text-align:center;color:var(--dim);scroll-snap-align:center;}
.it.on{color:var(--fg);}
/* selection band + fades: fixed layer above the wheel */
.wbox:before{content:"";position:absolute;left:0;right:0;top:109px;height:56px;border-top:3px solid var(--fg);border-bottom:3px solid var(--fg);pointer-events:none;z-index:2;}
.wbox:after{content:"";position:absolute;left:0;right:0;top:0;bottom:0;pointer-events:none;z-index:3;
  background:-webkit-linear-gradient(top,var(--bg) 0%,var(--bg0) 38%,var(--bg0) 62%,var(--bg) 100%);
  background:linear-gradient(to bottom,var(--bg) 0%,var(--bg0) 38%,var(--bg0) 62%,var(--bg) 100%);}

.foot{display:-webkit-box;display:-webkit-flex;display:flex;-webkit-box-align:center;-webkit-align-items:center;align-items:center;
  -webkit-box-pack:justify;-webkit-justify-content:space-between;justify-content:space-between;padding:0 48px 44px;}
.total{font-size:22px;font-weight:400;color:var(--dim);}
.total b{display:block;font-weight:700;font-size:54px;color:var(--fg);margin-top:8px;}
.total b.holding{opacity:.45;}
.coldStartNote{position:absolute;left:48px;bottom:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:15;
  font-size:16px;font-weight:400;color:var(--dim);white-space:nowrap;pointer-events:none;}
.coldStartNote.saved{-webkit-animation:coldSaved .35s steps(2) 1;animation:coldSaved .35s steps(2) 1;}
@-webkit-keyframes coldSaved{50%{color:var(--fg);}}
@keyframes coldSaved{50%{color:var(--fg);}}
.startBtn{height:112px;padding:0 70px;font-size:64px;background:var(--fg);color:var(--bg);
  -webkit-clip-path:polygon(0 12px,12px 12px,12px 0,calc(100% - 12px) 0,calc(100% - 12px) 12px,100% 12px,100% calc(100% - 12px),calc(100% - 12px) calc(100% - 12px),calc(100% - 12px) 100%,12px 100%,12px calc(100% - 12px),0 calc(100% - 12px));
  clip-path:polygon(0 12px,12px 12px,12px 0,calc(100% - 12px) 0,calc(100% - 12px) 12px,100% 12px,100% calc(100% - 12px),calc(100% - 12px) calc(100% - 12px),calc(100% - 12px) 100%,12px 100%,12px calc(100% - 12px),0 calc(100% - 12px));}
.startBtn:active{opacity:.6;}
.startBtn.off{opacity:.25;}

/* ---------- MULTIPLE CLASSIC TIMERS ---------- */
#classicSetup{display:-webkit-box;display:-webkit-flex;display:flex;-webkit-box-orient:vertical;-webkit-flex-direction:column;flex-direction:column;}
.classicTimers{-webkit-box-flex:1;-webkit-flex:1;flex:1;min-height:0;display:-webkit-box;display:-webkit-flex;display:flex;
  padding:104px 24px 28px;box-sizing:border-box;}
.timerCard{position:relative;-webkit-box-flex:1;-webkit-flex:1 1 0;flex:1 1 0;min-width:0;border:0;
  display:-webkit-box;display:-webkit-flex;display:flex;-webkit-box-orient:vertical;-webkit-flex-direction:column;flex-direction:column;
  -webkit-box-align:center;-webkit-align-items:center;align-items:center;-webkit-box-pack:center;-webkit-justify-content:center;justify-content:center;overflow:hidden;}
.timerCard+.timerCard{border-left:1px solid var(--dim);margin-left:16px;}
.timerCard:only-child{max-width:560px;margin-left:auto;margin-right:auto;}
.timerEditor,.timerActive{width:100%;height:100%;display:-webkit-box;display:-webkit-flex;display:flex;
  -webkit-box-orient:vertical;-webkit-flex-direction:column;flex-direction:column;-webkit-box-align:center;-webkit-align-items:center;align-items:center;
  -webkit-box-pack:center;-webkit-justify-content:center;justify-content:center;box-sizing:border-box;}
.timerEditor .wbox,.timerEditor .wheel{width:108px;height:328px;}
.timerEditor .wpad{height:130px;}
.timerEditor .it{height:68px;line-height:72px;font-size:50px;}
.timerEditor .wbox:before{top:127px;height:68px;}
.timerEditor .sep{font-size:42px;width:22px;}
.timerEditor .units span{width:108px;}
.timerEditor .units i{width:22px;}
.timerEditor .startBtn{height:72px;margin-top:22px;padding:0 38px;font-size:38px;}
.timerRemove{position:absolute;right:8px;top:8px;width:48px;height:48px;z-index:4;font-family:Arial,sans-serif;font-size:44px;
  line-height:44px;font-weight:400;color:var(--fg);}
.timerRemove:active{opacity:.4;}
.timerActive{cursor:pointer;padding:26px 18px 22px;}
.timerDigits{font-family:"04B30","Silk",monospace;font-size:19vh;font-size:max(100px,min(19vh,216px));font-size:clamp(100px,19vh,216px);line-height:1;white-space:nowrap;text-align:center;
  width:100%;min-height:0;-webkit-box-flex:1;-webkit-flex:1;flex:1;display:-webkit-box;display:-webkit-flex;display:flex;
  -webkit-box-orient:vertical;-webkit-flex-direction:column;flex-direction:column;-webkit-justify-content:space-evenly;justify-content:space-evenly;}
.timerDigits .timerLine{display:block;}
/* three timers side by side: the digits also follow the card width */
.timerCard:first-child:nth-last-child(3):not(.done) .timerDigits,.timerCard:first-child:nth-last-child(3)~.timerCard:not(.done) .timerDigits{font-size:min(19vh,216px,calc((100vw - 80px)/7));}

<script>
(function(){
"use strict";

/* ================= utilities ================= */
function $(id){return document.getElementById(id);}
function pad(n){return (n<10?"0":"")+n;}
function fmt(sec){
  var h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;
  return h>0 ? h+":"+pad(m)+":"+pad(s) : pad(m)+":"+pad(s);
}
function now(){return window.performance&&performance.now?performance.now():Date.now();}
function load(k,def){try{var v=localStorage.getItem(k);return v?JSON.parse(v):def;}catch(e){return def;}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function gc(el){return el.getAttribute("class")||"";}
function addCls(el,c){var k=gc(el);if((" "+k+" ").indexOf(" "+c+" ")<0)el.setAttribute("class",(k+" "+c).replace(/^\s+/,""));}
function rmCls(el,c){el.setAttribute("class",(" "+gc(el)+" ").replace(" "+c+" "," ").replace(/^\s+|\s+$/g,""));}
function updateDeviceSizeClass(){
  var w=window.screen&&screen.width?screen.width:window.innerWidth;
  var h=window.screen&&screen.height?screen.height:window.innerHeight;
  if(Math.min(w,h)<744)addCls(document.documentElement,"compactDevice");
  else rmCls(document.documentElement,"compactDevice");
}
function setX(el,pct,ms){
  var t=ms>0?("-webkit-transform "+ms+"ms linear"):"none";
  el.style.webkitTransition=t;el.style.transition=ms>0?("transform "+ms+"ms linear"):"none";
  el.style.webkitTransform=el.style.transform="translate3d("+pct+"%,0,0)";
}

/* fast tap: touchend with no delay, click as fallback (desktop) */
var lastTouch=0;
function onTap(el,fn){
  el.addEventListener("touchend",function(e){lastTouch=Date.now();e.preventDefault();audioWake();fn(e);},false);
  el.addEventListener("click",function(e){if(Date.now()-lastTouch<800)return;audioWake();fn(e);},false);
}

/* block page bounce, but let the wheels scroll */
document.addEventListener("touchmove",function(e){
  var t=e.target;
  while(t&&t!==document.body){if(t.className&&(" "+t.className+" ").indexOf(" wheel ")>=0)return;t=t.parentNode;}
  e.preventDefault();
},{passive:false});
document.addEventListener("gesturestart",function(e){e.preventDefault();},false);

/* ================= audio (Web Audio: mixes with music) ================= */
var AC=window.AudioContext||window.webkitAudioContext;
var ctx=null,master=null,shaper=null;
function audioInit(){
  if(ctx||!AC)return;
  ctx=new AC();
  master=ctx.createGain();master.gain.value=volGain(vol);   /* global volume: every sound passes through here */
  shaper=ctx.createWaveShaper();
  var n=2048,c=new Float32Array(n);
  for(var i=0;i<n;i++){var x=i*2/n-1;c[i]=Math.max(-1,Math.min(1,x*2.2));}   /* saturation: more perceived "presence" */
  shaper.curve=c;
  shaper.connect(master);master.connect(ctx.destination);
  /* silent buffer to unlock audio on iOS */
  var b=ctx.createBuffer(1,1,22050),s=ctx.createBufferSource();s.buffer=b;s.connect(ctx.destination);
  if(s.start)s.start(0);else s.noteOn(0);
}
function audioWake(){
  audioInit();
  if(ctx&&ctx.state!=="running"&&ctx.resume){try{ctx.resume();}catch(e){}}
}
/* a "beep": two square waves a fifth apart, saturated. 1–3 kHz is the range where
   the ear is most sensitive and where the iPad speaker performs best */
function tone(freq,dur,delay){
  if(!ctx)return;
  var t=ctx.currentTime+(delay||0)+0.01;
  var g=ctx.createGain();
  g.gain.setValueAtTime(0,t);
  g.gain.linearRampToValueAtTime(0.9,t+0.004);
  g.gain.setValueAtTime(0.9,t+dur-0.02);
  g.gain.linearRampToValueAtTime(0,t+dur);
  g.connect(shaper);
  var fs=[freq,freq*1.5];
  for(var i=0;i<2;i++){
    var o=ctx.createOscillator();o.type="square";o.frequency.value=fs[i];
    o.connect(g);o.start(t);o.stop(t+dur+0.02);
  }
}
var SND={
  pip:function(){tone(1568,0.13);},
  warm:function(){tone(1318,0.18);tone(1318,0.18,0.28);},
  work:function(){tone(2093,0.9);},
  rest:function(){tone(1046,0.28);tone(1046,0.28,0.38);tone(1046,0.28,0.76);},
  done:function(){tone(2093,0.4);tone(2093,0.4,0.55);tone(2637,1.1,1.1);},
  test:function(){tone(2093,0.5);},
  preview:function(){tone(2093,0.16);}
};

/* ================= global alarm volume =================
   Levels 0–10, saved like the other settings. It acts on the master node, so it
   applies to every sound in the app. Each step is 4 dB (perceptually even);
   0 = mute, 10 = full volume (the original behaviour). */
var VOL_MAX=10;
var vol=load("iv.volume",VOL_MAX);
if(!(typeof vol==="number"&&vol%1===0&&vol>=0&&vol<=VOL_MAX))vol=VOL_MAX;
function volGain(l){return l<=0?0:Math.pow(10,(l-VOL_MAX)*4/20);}
var volOpen=false,volSegs=[];
(function(){
  var m=$("volMeter"),html="";
  for(var i=1;i<=VOL_MAX;i++)html+='<i style="height:'+Math.round(22+78*i/VOL_MAX)+'%"></i>';
  m.innerHTML=html;volSegs=m.getElementsByTagName("i");
})();
function soundIcon(show){
  if(show&&vol===0){addCls($("icoSound"),"hidden");rmCls($("icoMute"),"hidden");}
  else if(show){rmCls($("icoSound"),"hidden");addCls($("icoMute"),"hidden");}
  else{addCls($("icoSound"),"hidden");addCls($("icoMute"),"hidden");}
}
function renderVol(){
  for(var i=0;i<volSegs.length;i++){if(i<vol)addCls(volSegs[i],"on");else rmCls(volSegs[i],"on");}
  var txt=vol===0?"Mute":vol+"/"+VOL_MAX;
  $("volVal").innerHTML=txt;
  $("volMeter").setAttribute("aria-valuenow",String(vol));$("volMeter").setAttribute("aria-valuetext",txt);
  if(vol<=0)addCls($("volDown"),"off");else rmCls($("volDown"),"off");
  if(vol>=VOL_MAX)addCls($("volUp"),"off");else rmCls($("volUp"),"off");
  if(mode!=="classic")soundIcon(true);
}
function setVolume(l,preview){
  l=Math.max(0,Math.min(VOL_MAX,l));
  if(l!==vol){vol=l;save("iv.volume",vol);}
  if(master)master.gain.value=volGain(vol);
  renderVol();
  if(preview&&vol>0)SND.preview();
}
function openVol(){
  volOpen=true;renderVol();
  rmCls($("volShade"),"hidden");rmCls($("volPop"),"hidden");$("testBtn").setAttribute("aria-expanded","true");
}
function closeVol(){
  if(!volOpen)return;
  volOpen=false;
  addCls($("volShade"),"hidden");addCls($("volPop"),"hidden");$("testBtn").setAttribute("aria-expanded","false");
}
onTap($("volShade"),closeVol);
onTap($("volDown"),function(){setVolume(vol-1,true);});
onTap($("volUp"),function(){setVolume(vol+1,true);});
/* the bar also works by tapping or dragging a finger across it */
(function(){
  var m=$("volMeter"),dragging=false;
  function levelAt(x){
    var r=m.getBoundingClientRect(),w=r.width-12;
    if(w<=0)return vol;
    return Math.ceil((x-r.left-6)/w*VOL_MAX);
  }
  m.addEventListener("touchstart",function(e){e.preventDefault();dragging=true;setVolume(levelAt(e.touches[0].clientX),false);},{passive:false});
  m.addEventListener("touchmove",function(e){e.preventDefault();if(dragging)setVolume(levelAt(e.touches[0].clientX),false);},{passive:false});
  m.addEventListener("touchend",function(e){e.preventDefault();lastTouch=Date.now();audioWake();if(dragging){dragging=false;setVolume(vol,true);}},{passive:false});
  m.addEventListener("touchcancel",function(){dragging=false;},false);
  m.addEventListener("mousedown",function(e){if(Date.now()-lastTouch<800)return;dragging=true;audioWake();setVolume(levelAt(e.clientX),false);},false);
  document.addEventListener("mousemove",function(e){if(dragging)setVolume(levelAt(e.clientX),false);},false);
  document.addEventListener("mouseup",function(){if(dragging){dragging=false;setVolume(vol,true);}},false);
  m.addEventListener("keydown",function(e){
    var k=e.keyCode;
    if(k===37||k===40){e.preventDefault();audioWake();setVolume(vol-1,true);}
    else if(k===39||k===38){e.preventDefault();audioWake();setVolume(vol+1,true);}
  },false);
})();
document.addEventListener("keydown",function(e){if(volOpen&&e.keyCode===27)closeVol();},false);

/* ================= keep screen on (Wake Lock) =================
   Active while a timer or the stopwatch is running or paused. Where the API
   does not exist (iOS < 16.4) it does nothing. */
var wakeLock=null,wakeWanted=false,wakePending=false;
function wakeNeeded(){
  if(runVisible&&T.running)return true;
  if(SW&&(SW.running||(SW.elapsed>0&&mode==="stopwatch"&&!runVisible)))return true;
  for(var i=0;i<classicCards.length;i++)if(classicCards[i].state==="running"||classicCards[i].state==="paused")return true;
  return false;
}
function updateWakeLock(){
  wakeWanted=wakeNeeded();
  if(!navigator.wakeLock||!navigator.wakeLock.request)return;
  if(wakeWanted&&!wakeLock&&!wakePending&&document.visibilityState==="visible"){
    wakePending=true;
    navigator.wakeLock.request("screen").then(function(l){
      wakePending=false;
      if(!wakeWanted){l.release().catch(function(){});return;}
      wakeLock=l;
      l.addEventListener("release",function(){if(wakeLock===l)wakeLock=null;});
    }).catch(function(){wakePending=false;});
  }else if(!wakeWanted&&wakeLock){
    var l=wakeLock;wakeLock=null;l.release().catch(function(){});
  }
}
/* the system releases the lock when the app goes to the background: re-acquire it on return */
document.addEventListener("visibilitychange",function(){if(document.visibilityState==="visible")updateWakeLock();},false);

/* ================= theme ================= */
var theme=load("iv.theme","dark");
var mode=load("iv.mode","interval");
if(mode!=="interval"&&mode!=="classic"&&mode!=="stopwatch")mode="interval";
var coldStart=load("iv.coldStart","");
/* The "cold start" note disappears 6 hours after it was set. */
var COLD_TTL=6*3600*1000,coldTimer=null;
var coldStartAt=load("iv.coldStartAt",0);
if(typeof coldStart!=="string")coldStart="";
if(coldStart&&!(typeof coldStartAt==="number"&&coldStartAt>0)){
  /* value saved by an older version (time only): rebuild the date from the
     most recent past occurrence of that hh:mm */
  var cm=/^(\d\d):(\d\d)$/.exec(coldStart);
  if(cm){
    var cd=new Date();cd.setHours(parseInt(cm[1],10),parseInt(cm[2],10),0,0);
    if(cd.getTime()>Date.now())cd.setDate(cd.getDate()-1);
    coldStartAt=cd.getTime();save("iv.coldStartAt",coldStartAt);
  }else{coldStart="";save("iv.coldStart","");}
}
function applyTheme(){
  var light=theme==="light";
  var color=light?"#ffffff":"#000000";
  /* toggle only the "light" class: overwriting className would drop compactDevice */
  if(light){addCls(document.documentElement,"light");addCls(document.body,"light");}
  else{rmCls(document.documentElement,"light");rmCls(document.body,"light");}
  /* iOS often caches the color of system areas: besides the CSS
     variables we set the actual color of the two page layers. */
  document.documentElement.style.backgroundColor=color;
  document.body.style.backgroundColor=color;
  document.documentElement.style.colorScheme=light?"light":"dark";
  /* Replacing the node, instead of just the content attribute, forces Safari
     to re-read theme-color immediately even after several consecutive changes. */
  var oldTheme=$("themeColor");
  var newTheme=oldTheme.cloneNode(false);
  newTheme.setAttribute("content",color);
  oldTheme.parentNode.replaceChild(newTheme,oldTheme);
  /* in dark the sun is shown (switch to light), in light the moon (switch to dark) */
  if(theme==="light"){rmCls($("icoMoon"),"hidden");addCls($("icoSun"),"hidden");}
  else{addCls($("icoMoon"),"hidden");rmCls($("icoSun"),"hidden");}
  if(runVisible)drawNow();
}
onTap($("themeBtn"),function(){theme=theme==="light"?"dark":"light";save("iv.theme",theme);applyTheme();});
onTap($("testBtn"),function(){
  if(mode==="classic")addClassicTimer();else if(volOpen)closeVol();else openVol();
});
onTap($("modeBtn"),toggleMode);

/* Long press on TOTAL TIME: stores the workout start time. */
function renderColdStart(){
  var note=$("coldStartNote");
  if(coldTimer){clearTimeout(coldTimer);coldTimer=null;}
  if(coldStart){
    var left=coldStartAt+COLD_TTL-Date.now();
    if(left<=0){coldStart="";coldStartAt=0;save("iv.coldStart","");save("iv.coldStartAt",0);}
    else coldTimer=setTimeout(renderColdStart,Math.min(left+500,COLD_TTL+1000));
  }
  if(coldStart&&!runVisible){note.innerHTML="cold start at "+coldStart;rmCls(note,"hidden");}
  else addCls(note,"hidden");
}
function setColdStart(){
  var d=new Date();coldStart=pad(d.getHours())+":"+pad(d.getMinutes());coldStartAt=d.getTime();
  save("iv.coldStart",coldStart);save("iv.coldStartAt",coldStartAt);renderColdStart();kick($("coldStartNote"),"saved");
}
/* iOS freezes timers in the background: check again when the app comes back */
document.addEventListener("visibilitychange",function(){if(document.visibilityState==="visible")renderColdStart();},false);
window.addEventListener("pageshow",renderColdStart,false);
function bindColdStartHold(el){
  var timer=null,touching=false,lastTouchHold=0;
  function begin(e){
    if(timer)return;
    if(e&&e.type==="touchstart"){touching=true;lastTouchHold=Date.now();if(e.preventDefault)e.preventDefault();}
    else if(touching||Date.now()-lastTouchHold<800)return;
    addCls(el,"holding");
    timer=setTimeout(function(){timer=null;rmCls(el,"holding");setColdStart();},3000);
  }
  function cancel(e){
    if(e&&(e.type==="touchend"||e.type==="touchcancel")){touching=false;lastTouchHold=Date.now();if(e.preventDefault)e.preventDefault();}
    if(timer){clearTimeout(timer);timer=null;}rmCls(el,"holding");
  }
  el.addEventListener("touchstart",begin,{passive:false});
  el.addEventListener("touchend",cancel,{passive:false});
  el.addEventListener("touchcancel",cancel,false);
  el.addEventListener("mousedown",begin,false);
  el.addEventListener("mouseup",cancel,false);
  el.addEventListener("mouseleave",cancel,false);
}
bindColdStartHold($("total"));

/* ================= iOS-style wheels ================= */
var IH=56;
/* Stored values may be corrupted or come from an older version: every field
   is validated and replaced with its default when invalid. */
function validInt(v,min,max){return typeof v==="number"&&v%1===0&&v>=min&&v<=max;}
function validPair(a,maxM,def){
  return (a&&typeof a==="object"&&validInt(a[0],0,maxM)&&validInt(a[1],0,59))?[a[0],a[1]]:[def[0],def[1]];
}
function validSettings(v){
  var o=(v&&typeof v==="object")?v:{};
  return {wu:validPair(o.wu,59,[0,15]),wk:validPair(o.wk,59,[3,0]),rs:validPair(o.rs,59,[1,0]),rd:validInt(o.rd,1,99)?o.rd:6};
}
var S=validSettings(load("iv.settings",null));
var CLASSIC_DEFAULT=[1,30];
var C=validPair(load("iv.classic",null),99,CLASSIC_DEFAULT);
var wheels={};
var wheelSyncing=false;
function Wheel(el,min,max,val,onChange){
  var self=this,html='<div class="wpad"></div>';
  for(var v=min;v<=max;v++)html+='<div class="it" data-v="'+v+'">'+pad(v)+'</div>';
  html+='<div class="wpad"></div>';
  el.innerHTML=html;
  this.el=el;this.min=min;this.items=el.getElementsByClassName("it");this.idx=-1;
  /* Item height comes from the CSS (single timers use taller items). */
  this.ih=function(){
    var it=self.items[0],h=it&&window.getComputedStyle?parseFloat(window.getComputedStyle(it).height):0;
    return h>0?h:IH;
  };
  this.set=function(v){el.scrollTop=(v-min)*self.ih();self.mark(v-min);};
  this.mark=function(i){
    if(i===self.idx)return;
    if(self.idx>=0&&self.items[self.idx])rmCls(self.items[self.idx],"on");
    if(self.items[i])addCls(self.items[i],"on");
    self.idx=i;onChange(i+min);
  };
  var tmr=null;
  el.addEventListener("scroll",function(){
    /* When the setup is hidden some browsers reset scrollTop to 0:
       this must not become a new timer setting. */
    if(runVisible||wheelSyncing||el.clientHeight===0)return;
    var i=Math.round(el.scrollTop/self.ih());i=Math.max(0,Math.min(self.items.length-1,i));
    self.mark(i);
    clearTimeout(tmr);
    tmr=setTimeout(function(){var y=self.idx*self.ih();if(Math.abs(el.scrollTop-y)>1)el.scrollTop=y;},160);
  },false);
  el.addEventListener("click",function(e){
    var v=e.target.getAttribute&&e.target.getAttribute("data-v");
    if(v!==null&&v!==undefined)self.set(parseInt(v,10));
  },false);
  this.set(val);
}
function secsOf(a){return a[0]*60+a[1];}
function totalSecs(){
  var r=S.rd;return secsOf(S.wu)+r*secsOf(S.wk)+Math.max(0,r-1)*secsOf(S.rs);
}
var ready=false;
function changed(){
  if(!ready)return;
  $("total").innerHTML=fmt(totalSecs());
  if(secsOf(S.wk)>0)rmCls($("startBtn"),"off");else addCls($("startBtn"),"off");
  save("iv.settings",S);
}
function classicChanged(){
  save("iv.classic",C);
}
function bindWheel(id,key,part,min,max){
  var cur=key==="rd"?S.rd:S[key][part];
  wheels[id]=new Wheel($(id),min,max,cur,function(v){if(key==="rd")S.rd=v;else S[key][part]=v;changed();});
}
bindWheel("w_wu_m","wu",0,0,59);bindWheel("w_wu_s","wu",1,0,59);
bindWheel("w_wk_m","wk",0,0,59);bindWheel("w_wk_s","wk",1,0,59);
bindWheel("w_rs_m","rs",0,0,59);bindWheel("w_rs_s","rs",1,0,59);
bindWheel("w_rd","rd",0,1,99);

/* ================= independent classic timers ================= */
var classicCards=[],classicSerial=0,classicTick=null;
var classicMultiQuery=window.matchMedia?window.matchMedia("(orientation: landscape) and (min-width: 900px) and (min-height: 600px)"):null;
function classicMultiCapable(){return !!(classicMultiQuery&&classicMultiQuery.matches);}
function classicHasBusy(){
  for(var i=0;i<classicCards.length;i++)if(classicCards[i].state!=="setup")return true;
  return false;
}
function updateHeaderControls(){
  if(runVisible||mode!=="interval")closeVol();
  if(runVisible){addCls($("testBtn"),"hidden");addCls($("modeBtn"),"hidden");return;}
  if(mode==="classic"){
    soundIcon(false);rmCls($("icoAdd"),"hidden");
    if(classicMultiCapable()&&classicCards.length<3){rmCls($("testBtn"),"hidden");$("testBtn").setAttribute("aria-label","Add timer");}
    else addCls($("testBtn"),"hidden");
    if(classicHasBusy())addCls($("modeBtn"),"hidden");else rmCls($("modeBtn"),"hidden");
  }else if(mode==="interval"){
    soundIcon(true);addCls($("icoAdd"),"hidden");
    rmCls($("testBtn"),"hidden");rmCls($("modeBtn"),"hidden");$("testBtn").setAttribute("aria-label","Alarm volume");
  }else{
    soundIcon(true);addCls($("icoAdd"),"hidden");addCls($("testBtn"),"hidden");
    if(SW&&SW.running)addCls($("modeBtn"),"hidden");else rmCls($("modeBtn"),"hidden");
  }
}
function refreshClassicEditor(card){
  card.duration=secsOf(card.setting);
  if(card.duration>0)rmCls(card.startBtn,"off");else addCls(card.startBtn,"off");
  if(card.primary){C[0]=card.setting[0];C[1]=card.setting[1];classicChanged();}
}
function setClassicProgress(card,ratio){
  ratio=Math.max(0,Math.min(1,ratio));
  card.progress.style.webkitTransform=card.progress.style.transform="scaleX("+ratio+")";
}
function fmtClassicClock(sec){
  var m=Math.min(99,Math.floor(sec/60));
  return '<span class="timerLine">'+pad(m)+':</span><span class="timerLine">'+pad(sec%60)+'</span>';
}
function renderClassicCard(card,rem){
  if(card.state==="done"){
    card.digits.innerHTML="Done";card.stateText.innerHTML="Tap to return";setClassicProgress(card,0);
    addCls(card.stopBtn,"hidden");addCls(card.el,"done");return;
  }
  rmCls(card.el,"done");
  var sec=Math.max(0,Math.ceil(rem/1000));
  card.digits.innerHTML=fmtClassicClock(sec);setClassicProgress(card,card.duration?rem/(card.duration*1000):0);
  if(card.state==="paused"){
    card.stateText.innerHTML="Paused";rmCls(card.stopBtn,"hidden");
  }else{
    card.stateText.innerHTML="";addCls(card.stopBtn,"hidden");
  }
}
function classicLoop(){
  var t=Date.now(),hasRunning=false;
  for(var i=0;i<classicCards.length;i++){
    var card=classicCards[i];
    if(card.state!=="running")continue;
    hasRunning=true;
    var rem=card.end-t;
    if(rem<=0){
      card.state="done";card.remaining=0;renderClassicCard(card,0);SND.done();updateHeaderControls();updateWakeLock();
    }else if(Math.ceil(rem/1000)!==card.last){card.last=Math.ceil(rem/1000);renderClassicCard(card,rem);}
  }
  if(!hasRunning){clearInterval(classicTick);classicTick=null;}
}
function ensureClassicTick(){
  if(!classicTick)classicTick=setInterval(classicLoop,100);
  classicLoop();
}
function startClassicCard(card){
  refreshClassicEditor(card);if(card.duration<=0)return;
  card.state="running";card.end=Date.now()+card.duration*1000;card.remaining=card.duration*1000;card.last=-1;
  addCls(card.editor,"hidden");rmCls(card.active,"hidden");if(card.removeBtn)addCls(card.removeBtn,"hidden");
  updateHeaderControls();ensureClassicTick();updateWakeLock();
}
function resetClassicCard(card){
  card.state="setup";card.last=-1;addCls(card.active,"hidden");rmCls(card.editor,"hidden");rmCls(card.el,"done");
  setClassicProgress(card,1);
  if(card.removeBtn)rmCls(card.removeBtn,"hidden");card.wm.set(card.setting[0]);card.ws.set(card.setting[1]);
  updateHeaderControls();updateWakeLock();
}
function toggleClassicCard(card){
  if(card.state==="done"){resetClassicCard(card);return;}
  if(card.state==="running"){
    card.remaining=Math.max(0,card.end-Date.now());card.state="paused";renderClassicCard(card,card.remaining);
  }else if(card.state==="paused"){
    card.end=Date.now()+card.remaining;card.state="running";card.last=-1;renderClassicCard(card,card.remaining);ensureClassicTick();
  }
}
function stopClassicCard(card){resetClassicCard(card);}
function removeClassicCard(card){
  if(card.state!=="setup"||card.primary)return;
  for(var i=0;i<classicCards.length;i++)if(classicCards[i]===card){classicCards.splice(i,1);break;}
  card.el.parentNode.removeChild(card.el);updateHeaderControls();
}
function createClassicCard(setting,primary){
  var id=++classicSerial,card={setting:[setting[0],setting[1]],primary:!!primary,state:"setup",duration:0,last:-1};
  var el=document.createElement("div");el.className="timerCard";
  el.innerHTML=(primary?"":'<button class="timerRemove" aria-label="Remove timer">&times;</button>')+
    '<div class="timerEditor"><div class="pair"><div class="wbox"><div class="wheel" id="cm_'+id+'"></div></div><div class="sep">:</div><div class="wbox"><div class="wheel" id="cs_'+id+'"></div></div></div><div class="units"><span>min</span><i></i><span>sec</span></div><button class="startBtn off">Start</button></div>'+
    '<div class="timerActive hidden"><div class="timerDigits"><span class="timerLine">00:</span><span class="timerLine">00</span></div><div class="timerProgress"><div class="timerProgressFill"></div></div><div class="timerState"></div><button class="timerStop hidden">Stop</button></div>';
  $("classicTimers").appendChild(el);card.el=el;card.editor=el.getElementsByClassName("timerEditor")[0];
  card.active=el.getElementsByClassName("timerActive")[0];card.digits=el.getElementsByClassName("timerDigits")[0];
  card.stateText=el.getElementsByClassName("timerState")[0];card.progress=el.getElementsByClassName("timerProgressFill")[0];
  card.startBtn=el.getElementsByClassName("startBtn")[0];card.stopBtn=el.getElementsByClassName("timerStop")[0];
  card.removeBtn=el.getElementsByClassName("timerRemove")[0]||null;
  card.wm=new Wheel($("cm_"+id),0,99,card.setting[0],function(v){card.setting[0]=v;refreshClassicEditor(card);});
  card.ws=new Wheel($("cs_"+id),0,59,card.setting[1],function(v){card.setting[1]=v;refreshClassicEditor(card);});
  onTap(card.startBtn,function(){startClassicCard(card);});
  onTap(card.active,function(){toggleClassicCard(card);});
  onTap(card.stopBtn,function(e){if(e.stopPropagation)e.stopPropagation();stopClassicCard(card);});
  if(card.removeBtn)onTap(card.removeBtn,function(e){if(e.stopPropagation)e.stopPropagation();removeClassicCard(card);});
  classicCards.push(card);refreshClassicEditor(card);return card;
}
function addClassicTimer(){
  if(mode!=="classic"||!classicMultiCapable()||classicCards.length>=3)return;
  createClassicCard(CLASSIC_DEFAULT,false);updateHeaderControls();
}
createClassicCard(C,true);

/* ================= stopwatch =================
   Date.now keeps correct time even when Safari suspends frames
   in the background. The last two digits are hundredths of a second. */
var SW={running:false,elapsed:0,started:0,frame:0,lastMin:"",lastSec:"",lastCenti:"",lastLabel:""};
function renderStopwatch(){
  var elapsed=SW.running?Math.max(0,Date.now()-SW.started):SW.elapsed;
  var totalCenti=Math.floor(elapsed/10);
  var centi=totalCenti%100;
  var totalSec=Math.floor(totalCenti/100);
  var sec=totalSec%60;
  var min=Math.floor(totalSec/60);
  var m=pad(min),s=pad(sec),c=pad(centi);
  /* only the digits that changed are rewritten: minutes and seconds rarely do */
  if(c!==SW.lastCenti){SW.lastCenti=c;$("swCenti").innerHTML=c;}
  if(s!==SW.lastSec){SW.lastSec=s;$("swSec").innerHTML=s;}
  if(m!==SW.lastMin){SW.lastMin=m;$("swMin").innerHTML=m;}
  /* aria-label: once per second while running, with hundredths when stopped */
  var label=m+" minutes, "+s+" seconds"+(SW.running?"":", "+c+" hundredths");
  if(label!==SW.lastLabel){SW.lastLabel=label;$("stopwatchDisplay").setAttribute("aria-label",label);}
}
function stopwatchLoop(){
  if(!SW.running){SW.frame=0;return;}
  renderStopwatch();SW.frame=requestAnimationFrame(stopwatchLoop);
}
function startStopwatch(){
  if(SW.running)return;
  SW.started=Date.now()-SW.elapsed;SW.running=true;
  $("stopwatchToggle").innerHTML="Pause";$("stopwatchState").innerHTML="Running";
  updateHeaderControls();updateWakeLock();stopwatchLoop();
}
function pauseStopwatch(){
  if(!SW.running)return;
  SW.elapsed=Math.max(0,Date.now()-SW.started);SW.running=false;
  if(SW.frame)cancelAnimationFrame(SW.frame);SW.frame=0;renderStopwatch();
  $("stopwatchToggle").innerHTML="Resume";$("stopwatchState").innerHTML="Paused";
  updateHeaderControls();updateWakeLock();
}
function toggleStopwatch(){if(SW.running)pauseStopwatch();else startStopwatch();}
function resetStopwatch(){
  SW.running=false;SW.elapsed=0;SW.started=0;SW.lastMin=SW.lastSec=SW.lastCenti=SW.lastLabel="";
  if(SW.frame)cancelAnimationFrame(SW.frame);SW.frame=0;renderStopwatch();
  $("stopwatchToggle").innerHTML="Start";$("stopwatchState").innerHTML="Ready";
  updateHeaderControls();updateWakeLock();
}
onTap($("stopwatchToggle"),toggleStopwatch);
onTap($("stopwatchDisplay"),toggleStopwatch);
onTap($("stopwatchReset"),resetStopwatch);
document.addEventListener("visibilitychange",function(){if(document.visibilityState==="visible"&&SW.running)renderStopwatch();},false);

/* On iPhone (portrait and landscape) only one wheel at a time becomes editable after a tap.
   On iPad the wheels keep the original behavior. */
var mobileWheelQuery=window.matchMedia?window.matchMedia("(orientation: portrait) and (max-width: 743px), (orientation: landscape) and (max-height: 500px)"):null;
var editableWheelBox=null;
function isPhonePortrait(){return mobileWheelQuery&&mobileWheelQuery.matches;}
function setEditableWheel(box){
  var boxes=document.getElementsByClassName("wbox"),i;
  editableWheelBox=box||null;
  for(i=0;i<boxes.length;i++){
    rmCls(boxes[i],"mobile-locked");rmCls(boxes[i],"mobile-editing");
    if(isPhonePortrait())addCls(boxes[i],boxes[i]===editableWheelBox?"mobile-editing":"mobile-locked");
  }
}
function bindMobileWheelLocks(){
  var boxes=document.getElementsByClassName("wbox"),i;
  function activate(box,e){
    if(!isPhonePortrait()||box===editableWheelBox)return;
    if(e){e.preventDefault();e.stopPropagation();}
    setEditableWheel(box);
  }
  for(i=0;i<boxes.length;i++)(function(box){
    box.setAttribute("tabindex","0");
    box.addEventListener("touchend",function(e){activate(box,e);},{passive:false});
    box.addEventListener("click",function(e){activate(box,e);},false);
    box.addEventListener("keydown",function(e){if(e.keyCode===13||e.keyCode===32)activate(box,e);},false);
  })(boxes[i]);
  document.addEventListener("touchstart",function(e){
    if(isPhonePortrait()&&editableWheelBox&&!editableWheelBox.contains(e.target))setEditableWheel(null);
  },true);
  document.addEventListener("mousedown",function(e){
    if(isPhonePortrait()&&editableWheelBox&&!editableWheelBox.contains(e.target))setEditableWheel(null);
  },true);
  setEditableWheel(null);
}
bindMobileWheelLocks();
ready=true;changed();classicChanged();applyMode(false);

var cv=$("cv"),cx=cv.getContext("2d"),crumbCv=document.createElement("canvas"),crumbCx=crumbCv.getContext("2d"),
    CW=0,CH=0,DPR=1,view={str:"00:00",decay:0,seed:0};
function sizeCanvas(){
  var box=$("clock");DPR=window.devicePixelRatio||1;
  CW=box.clientWidth;CH=box.clientHeight;
  cv.width=Math.round(CW*DPR);cv.height=Math.round(CH*DPR);
  cv.style.width=CW+"px";cv.style.height=CH+"px";
}
function hash(a,b,c){var x=Math.sin(a*127.1+b*311.7+c*74.7)*43758.5453;return x-Math.floor(x);}
/* The active timer uses 04B30; the crumbling only affects the outline. */
function drawActiveClock(str,decay,seed){
  view.str=str;view.decay=decay;view.seed=seed;
  if(!CW)return;
  var fg=theme==="light"?"#000":"#fff";
  cx.setTransform(DPR,0,0,DPR,0,0);cx.clearRect(0,0,CW,CH);cx.fillStyle=fg;
  var fs=Math.floor(CH*0.72),font='700 '+fs+'px "04B30","Silk",monospace';
  cx.font=font;cx.textAlign="center";cx.textBaseline="alphabetic";
  var mt=cx.measureText(str),maxW=CW*0.92;
  if(mt.width>maxW){fs=Math.floor(fs*maxW/mt.width);font='700 '+fs+'px "04B30","Silk",monospace';cx.font=font;mt=cx.measureText(str);}
  var asc=mt.actualBoundingBoxAscent||fs*0.78,desc=mt.actualBoundingBoxDescent||fs*0.18;
  var tx=CW/2,ty=(CH-asc-desc)/2+asc-CH*0.025;
  cx.fillText(str,tx,ty);
  if(decay<=0)return;

  var ms=0.25,mw=Math.max(1,Math.round(CW*ms)),mh=Math.max(1,Math.round(CH*ms));
  if(crumbCv.width!==mw||crumbCv.height!==mh){crumbCv.width=mw;crumbCv.height=mh;}
  crumbCx.setTransform(1,0,0,1,0,0);crumbCx.clearRect(0,0,mw,mh);crumbCx.fillStyle="#fff";
  crumbCx.font='700 '+Math.max(1,Math.round(fs*ms))+'px "04B30","Silk",monospace';
  crumbCx.textAlign="center";crumbCx.textBaseline="alphabetic";crumbCx.fillText(str,tx*ms,ty*ms);
  var data=crumbCx.getImageData(0,0,mw,mh).data,step=2,rad=2;
  for(var my=rad;my<mh-rad;my+=step){
    for(var mx=rad;mx<mw-rad;mx+=step){
      var ai=(my*mw+mx)*4+3;if(data[ai]<96)continue;
      var edge=data[(my*mw+mx-rad)*4+3]<32||data[(my*mw+mx+rad)*4+3]<32||
               data[((my-rad)*mw+mx)*4+3]<32||data[((my+rad)*mw+mx)*4+3]<32;
      if(!edge||hash(mx+seed*11,my,seed+3.7)>=decay)continue;
      var px=mx/ms,py=my/ms,chip=3+hash(mx,my,seed)*2;
      cx.clearRect(px-chip/2,py-chip/2,chip,chip);
      var h2=hash(mx*1.7,my+seed*5.1,8.3);
      if(h2<0.55){
        var fall=5+(10+decay*70)*h2;
        if(py+fall<CH)cx.fillRect(px-1,py+fall,2.2,2.2);
      }
    }
  }
}
function drawNow(){drawActiveClock(view.str,view.decay,view.seed);}

/* ================= timer engine ================= */
var T={ph:[],i:0,end:0,rem:0,paused:false,running:false,done:false,last:-1},tick=null,runVisible=false;

function buildPhases(){
  var p=[],R=S.rd,wu=secsOf(S.wu),wk=secsOf(S.wk),rs=secsOf(S.rs);
  if(wu>0)p.push({k:"warm",n:"Warm up",d:wu});
  for(var r=1;r<=R;r++){
    p.push({k:"work",n:"Work",r:r,d:wk});
    if(rs>0&&r<R)p.push({k:"rest",n:"Rest",r:r,d:rs});   /* no rest after the last round */
  }
  return p;
}
function remainingTotal(curRemSec){
  var t=curRemSec;for(var j=T.i+1;j<T.ph.length;j++)t+=T.ph[j].d;return t;
}
function label(p){return p.n+(p.r?'<span class="rn">'+p.r+"/"+S.rd+"</span>":"");}
function setHud(l,r){$("hudL").innerHTML=l;$("hudR").innerHTML=r;}
function kick(el,cls){rmCls(el,cls);void el.offsetWidth;addCls(el,cls);}

function enterPhase(start,silent){
  var p=T.ph[T.i];
  T.end=start+p.d*1000;T.last=-1;
  $("phase").innerHTML=label(p);
  $("fill").className=p.k;
  setX($("eraser"),100,0);void $("eraser").offsetWidth;
  setX($("eraser"),0,Math.max(0,T.end-now()));
  var nx=T.ph[T.i+1];
  $("hudL").innerHTML="Next<b>"+(nx?nx.n+" "+fmt(nx.d):"Finish")+"</b>";
  if(silent)return;
  kick($("flash"),"go");kick($("phase"),"glitch");
  SND[p.k]();
}
function loop(){
  if(!T.running||T.paused)return;
  var t=now(),rem=T.end-t;
  if(rem<=0){
    /* On return from the background several phases may have expired: advance
       to the current one silently, then a single sound/flash. */
    do{
      T.i++;
      if(T.i>=T.ph.length){finish();return;}
      T.end+=T.ph[T.i].d*1000;    /* restart from the exact deadline: no drift */
    }while(T.end<=t);
    enterPhase(T.end-T.ph[T.i].d*1000);
    rem=T.end-t;
  }
  var p=T.ph[T.i],sec=Math.ceil(rem/1000);
  if(sec!==T.last){
    T.last=sec;
    if(sec<=3&&sec>=1&&p.d>3)SND.pip();
    var prog=1-rem/(p.d*1000);
    drawActiveClock(fmtClock(sec),0.015+prog*prog*0.185,T.i*1.31);
    $("hudR").innerHTML="Left<b>"+fmt(remainingTotal(sec))+"</b>";
  }
}
function fmtClock(sec){var m=Math.min(99,Math.floor(sec/60));return pad(m)+":"+pad(sec%60);}

function syncWheels(){
  wheels.w_wu_m.set(S.wu[0]);wheels.w_wu_s.set(S.wu[1]);
  wheels.w_wk_m.set(S.wk[0]);wheels.w_wk_s.set(S.wk[1]);
  wheels.w_rs_m.set(S.rs[0]);wheels.w_rs_s.set(S.rs[1]);wheels.w_rd.set(S.rd);
}
function syncClassicWheels(){
  for(var i=0;i<classicCards.length;i++){classicCards[i].wm.set(classicCards[i].setting[0]);classicCards[i].ws.set(classicCards[i].setting[1]);}
}
function syncActiveWheels(){if(mode==="classic")syncClassicWheels();else if(mode==="interval")syncWheels();}
function updateModeIcon(){
  addCls($("icoClassic"),"hidden");addCls($("icoInterval"),"hidden");addCls($("icoStopwatch"),"hidden");
  if(mode==="interval"){rmCls($("icoClassic"),"hidden");$("modeBtn").setAttribute("aria-label","Classic timer");}
  else if(mode==="classic"){rmCls($("icoStopwatch"),"hidden");$("modeBtn").setAttribute("aria-label","Stopwatch");}
  else{rmCls($("icoInterval"),"hidden");$("modeBtn").setAttribute("aria-label","Interval timer");}
  updateHeaderControls();
}
function applyMode(animate){
  var target=mode==="classic"?$("classicSetup"):(mode==="stopwatch"?$("stopwatchSetup"):$("setup"));
  addCls($("setup"),"hidden");addCls($("classicSetup"),"hidden");addCls($("stopwatchSetup"),"hidden");rmCls(target,"hidden");
  if(animate)kick(target,"setup-in");else rmCls(target,"setup-in");
  renderColdStart();updateModeIcon();
  if(mode!=="stopwatch"){
    wheelSyncing=true;syncActiveWheels();
    requestAnimationFrame(function(){syncActiveWheels();requestAnimationFrame(function(){wheelSyncing=false;});});
  }
}
function toggleMode(){
  if(runVisible||classicHasBusy()||(SW&&SW.running))return;
  mode=mode==="interval"?"classic":(mode==="classic"?"stopwatch":"interval");save("iv.mode",mode);applyMode(true);updateWakeLock();
}
function showRun(){
  runVisible=true;closeVol();
  renderColdStart();
  addCls($("setup"),"hidden");addCls($("classicSetup"),"hidden");addCls($("stopwatchSetup"),"hidden");rmCls($("run"),"hidden");
  addCls($("testBtn"),"hidden");addCls($("modeBtn"),"hidden");
  sizeCanvas();
}
function showSetup(){
  addCls($("run"),"hidden");applyMode(false);
  /* Visually restore the last configuration: during this operation
     runVisible stays true, so synthetic scrolls do not modify S. */
  syncActiveWheels();
  requestAnimationFrame(function(){
    syncActiveWheels();requestAnimationFrame(function(){runVisible=false;renderColdStart();updateHeaderControls();});
  });
}
function start(){
  if(secsOf(S.wk)<=0)return;
  T.ph=buildPhases();T.i=0;T.paused=false;T.done=false;T.running=true;
  setPausedUI(false);showRun();
  enterPhase(now());
  clearInterval(tick);tick=setInterval(loop,100);loop();
  updateWakeLock();
}
function pause(){
  T.paused=true;T.rem=Math.max(0,T.end-now());
  var p=T.ph[T.i];
  setX($("eraser"),100*T.rem/(p.d*1000),0);
  setPausedUI(true);
}
function resume(){
  T.end=now()+T.rem;T.paused=false;
  setX($("eraser"),0,T.rem);
  setPausedUI(false);loop();
}
function setPausedUI(on){
  if(on){addCls($("clock"),"paused");rmCls($("pauseTag"),"hidden");rmCls($("pauseCtl"),"hidden");}
  else{rmCls($("clock"),"paused");addCls($("pauseTag"),"hidden");addCls($("pauseCtl"),"hidden");}
}
function stop(){T.running=false;clearInterval(tick);setPausedUI(false);showSetup();updateWakeLock();}
function skip(){
  T.i++;T.paused=false;setPausedUI(false);
  if(T.i>=T.ph.length){finish();return;}
  enterPhase(now());loop();
}
function finish(){
  T.running=false;T.done=true;clearInterval(tick);updateWakeLock();
  $("phase").innerHTML="Done";
  setX($("eraser"),100,0);$("fill").className="work";
  drawActiveClock(fmtClock(Math.min(5999,totalSecs())),0,0);
  setHud("Workout complete","Tap to return");
  kick($("flash"),"go");kick($("phase"),"glitch");
  SND.done();
}

onTap($("startBtn"),start);
onTap($("clock"),function(){
  if(T.done){T.done=false;showSetup();return;}
  if(!T.running)return;
  if(T.paused)resume();else pause();
});
onTap($("stopBtn"),stop);
onTap($("skipBtn"),skip);

function onResize(){updateDeviceSizeClass();setEditableWheel(editableWheelBox);updateHeaderControls();if(!runVisible&&mode==='classic'){wheelSyncing=true;syncClassicWheels();requestAnimationFrame(function(){wheelSyncing=false;});}if(runVisible){sizeCanvas();drawNow();}}
window.addEventListener("resize",onResize,false);
window.addEventListener("orientationchange",function(){setTimeout(onResize,300);},false);
if(classicMultiQuery){
  if(classicMultiQuery.addEventListener)classicMultiQuery.addEventListener("change",updateHeaderControls);
  else if(classicMultiQuery.addListener)classicMultiQuery.addListener(updateHeaderControls);
}

updateDeviceSizeClass();
applyTheme();
renderColdStart();
if(document.fonts&&document.fonts.load){
  document.fonts.load('700 100px "04B30"').then(function(){if(runVisible)drawNow();},function(){});
}

if("serviceWorker" in navigator){
  window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){});});
}
})();
