<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CYBER TIMER">
  <meta name="theme-color" content="#000000">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-180.png">
  <title>CYBER TIMER</title>
  <style>
    :root {
      --bg:#000;
      --fg:#fff;
      --muted:#777;
      --line:#fff;
      --panel:#090909;
    }
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html, body { margin:0; width:100%; height:100%; overflow:hidden; background:var(--bg); color:var(--fg); }
    body {
      font-family:"Courier New", Courier, monospace;
      font-weight:700;
      -webkit-font-smoothing:none;
      text-rendering:geometricPrecision;
    }
    button, select { font:inherit; color:inherit; }
    button { border:0; background:none; padding:0; }
    .screen { position:fixed; top:0; right:0; bottom:0; left:0; display:none; }
    .screen.active { display:flex; }

    /* SETUP */
    #setup {
      flex-direction:column;
      padding:16px 22px 18px;
      background:var(--bg);
    }
    .setup-head {
      display:flex; align-items:center; justify-content:space-between;
      min-height:44px; border-bottom:2px solid var(--line);
      margin-bottom:16px;
    }
    .brand { font-size:21px; letter-spacing:3px; }
    .theme-btn {
      width:44px; height:38px; border:2px solid var(--line);
      display:flex; align-items:center; justify-content:center;
      cursor:pointer;
    }
    .theme-icon { width:18px; height:18px; display:block; }
    .moon-icon {
      position:relative; width:18px; height:18px; border:2px solid currentColor;
      border-radius:50%; overflow:hidden;
    }
    .moon-icon:after {
      content:""; position:absolute; width:17px; height:17px; left:5px; top:-3px;
      background:var(--bg); border-radius:50%;
    }
    .sun-icon { position:relative; width:18px; height:18px; border:2px solid currentColor; border-radius:50%; }
    .sun-icon:before, .sun-icon:after {
      content:""; position:absolute; left:50%; top:50%; width:26px; height:2px;
      background:currentColor; transform:translate(-50%,-50%);
    }
    .sun-icon:after { transform:translate(-50%,-50%) rotate(45deg); }

    .fields {
      flex:1; display:grid; grid-template-columns:repeat(4,1fr);
      gap:12px; align-items:stretch; min-height:0;
    }
    .field {
      border:2px solid var(--line); display:flex; flex-direction:column;
      justify-content:space-between; min-width:0; padding:13px 10px 10px;
      background:var(--panel);
    }
    .field-label { font-size:17px; letter-spacing:1px; }
    .field-value { display:grid; grid-template-columns:1fr 22px 1fr; gap:4px; align-items:center; }
    .field.round .field-value { grid-template-columns:1fr; }
    select {
      width:100%; min-width:0; height:58px; padding:4px 2px;
      -webkit-appearance:menulist; appearance:auto;
      background:var(--bg); color:var(--fg); border:2px solid var(--line);
      border-radius:0; font-size:28px; font-weight:700; text-align:center;
    }
    .colon { font-size:26px; text-align:center; }
    .unit { font-size:11px; color:var(--muted); margin-top:7px; letter-spacing:1px; }
    #startBtn {
      margin-top:14px; height:70px; border:3px solid var(--line);
      background:var(--fg); color:var(--bg); font-size:28px; letter-spacing:3px;
      cursor:pointer;
    }
    #startBtn:active, .theme-btn:active { opacity:.75; }

    /* TIMER */
    #timer { flex-direction:column; background:var(--bg); }
    .timer-top {
      flex:0 0 18%; min-height:0; display:flex; align-items:flex-end;
      justify-content:center; padding:10px 22px 7px; border-bottom:2px solid var(--line);
    }
    #phase {
      font-size:38px; line-height:1; letter-spacing:3px; text-align:center;
      max-width:100%; overflow:hidden; white-space:nowrap;
    }
    #clockZone {
      flex:1; min-height:0; display:flex; align-items:center; justify-content:center;
      position:relative; cursor:pointer; user-select:none; -webkit-user-select:none;
    }
    #clock {
      width:100%; text-align:center; white-space:nowrap;
      font-size:22vw; line-height:.86; letter-spacing:-7px;
      font-variant-numeric:tabular-nums;
      -webkit-font-smoothing:none;
      text-shadow:2px 0 0 var(--fg), -2px 0 0 var(--fg);
    }
    #clock:after {
      content:""; display:block; width:72%; height:3px; margin:10px auto 0;
      background:var(--fg); opacity:.12;
    }
    #clock.paused { opacity:.42; }
    .timer-bottom { flex:0 0 15%; min-height:0; display:flex; flex-direction:column; justify-content:flex-end; }
    #progressTrack { width:100%; height:14px; border-top:2px solid var(--line); background:var(--bg); }
    #progressBar { height:100%; width:0%; background:var(--fg); }
    .timer-hint { height:46px; display:flex; align-items:center; justify-content:center; padding:0 14px; }
    #status { font-size:13px; letter-spacing:1px; color:var(--muted); text-align:center; }

    .invert {
      --bg:#fff; --fg:#000; --muted:#555; --line:#000; --panel:#f2f2f2;
    }

    @media (orientation:portrait) {
      body:after {
        content:"RUOTA L'IPAD IN ORIZZONTALE";
        position:fixed; top:0; right:0; bottom:0; left:0; z-index:9999;
        background:#000; color:#fff; display:flex; align-items:center; justify-content:center;
        text-align:center; font-size:24px; padding:30px;
      }
    }
  </style>
</head>
<body>
  <section id="setup" class="screen active">
    <div class="setup-head">
      <div class="brand">CYBER TIMER</div>
      <button id="themeBtn" class="theme-btn" aria-label="Cambia tema"><span class="theme-icon moon-icon"></span></button>
    </div>

    <div class="fields">
      <div class="field">
        <div class="field-label">WARM UP</div>
        <div>
          <div class="field-value">
            <select id="wuM" aria-label="Minuti warm up"></select><div class="colon">:</div><select id="wuS" aria-label="Secondi warm up"></select>
          </div>
          <div class="unit">MM : SS</div>
        </div>
      </div>
      <div class="field">
        <div class="field-label">WORK</div>
        <div>
          <div class="field-value">
            <select id="workM" aria-label="Minuti work"></select><div class="colon">:</div><select id="workS" aria-label="Secondi work"></select>
          </div>
          <div class="unit">MM : SS</div>
        </div>
      </div>
      <div class="field">
        <div class="field-label">REST</div>
        <div>
          <div class="field-value">
            <select id="restM" aria-label="Minuti rest"></select><div class="colon">:</div><select id="restS" aria-label="Secondi rest"></select>
          </div>
          <div class="unit">MM : SS</div>
        </div>
      </div>
      <div class="field round">
        <div class="field-label">ROUNDS</div>
        <div>
          <div class="field-value"><select id="rounds" aria-label="Numero di round"></select></div>
          <div class="unit">REPETITIONS</div>
        </div>
      </div>
    </div>
    <button id="startBtn">START</button>
  </section>

  <section id="timer" class="screen">
    <div class="timer-top"><div id="phase">READY</div></div>
    <div id="clockZone" role="button" aria-label="Pausa o riprendi">
      <div id="clock">00:00</div>
    </div>
    <div class="timer-bottom">
      <div id="progressTrack"><div id="progressBar"></div></div>
      <div class="timer-hint"><div id="status">TAP CENTRE = PAUSE</div></div>
    </div>
  </section>

<script>
(function () {
  "use strict";

  var $ = function(id) { return document.getElementById(id); };
  var root = document.documentElement;
  var setup = $("setup"), timer = $("timer");
  var phase = $("phase"), clock = $("clock"), progress = $("progressBar"), status = $("status");
  var timerId = null, audioCtx = null, paused = false, running = false;
  var phaseIndex = 0, roundIndex = 1, remainingMs = 0, phaseTotalMs = 0, lastTick = 0;
  var settings = null;

  function fillSelect(id, max, selected) {
    var el = $(id), html = "", i, label;
    for (i = 0; i <= max; i++) {
      label = i < 10 ? "0" + i : "" + i;
      html += '<option value="' + i + '"' + (i === selected ? " selected" : "") + '>' + label + '</option>';
    }
    el.innerHTML = html;
  }

  function fillRounds() {
    var el = $("rounds"), html = "", i;
    for (i = 1; i <= 20; i++) {
      html += '<option value="' + i + '"' + (i === 6 ? " selected" : "") + '>' + i + '</option>';
    }
    el.innerHTML = html;
  }

  fillSelect("wuM", 10, 0);
  fillSelect("wuS", 59, 30);
  fillSelect("workM", 20, 1);
  fillSelect("workS", 59, 0);
  fillSelect("restM", 20, 30);
  fillSelect("restS", 59, 0);
  fillRounds();

  function themeIcon(el) {
    if (root.className.indexOf("invert") >= 0) {
      el.innerHTML = '<span class="theme-icon sun-icon"></span>';
    } else {
      el.innerHTML = '<span class="theme-icon moon-icon"></span>';
    }
  }

  function applyTheme(name) {
    root.className = name === "invert" ? "invert" : "";
    themeIcon($("themeBtn"));
  }

  function toggleTheme() {
    var next = root.className.indexOf("invert") >= 0 ? "" : "invert";
    applyTheme(next);
    try { localStorage.setItem("cyberTheme", next); } catch (e) {}
  }

  try { applyTheme(localStorage.getItem("cyberTheme") || ""); } catch (e) { applyTheme(""); }
  $("themeBtn").onclick = toggleTheme;

  function value(id) { return parseInt($(id).value, 10) || 0; }
  function duration(m, s) { return (m * 60 + s) * 1000; }

  function readSettings() {
    return {
      warm: duration(value("wuM"), value("wuS")),
      work: duration(value("workM"), value("workS")),
      rest: duration(value("restM"), value("restS")),
      rounds: value("rounds")
    };
  }

  /* iOS Safari may suspend audio until a user gesture. START is the unlock point. */
  function ensureAudio() {
    var AC;
    try {
      if (!audioCtx) {
        AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return false;
        audioCtx = new AC();
      }
      if (audioCtx.state === "suspended" && audioCtx.resume) audioCtx.resume();
      return true;
    } catch (e) {
      audioCtx = null;
      return false;
    }
  }

  function tone(freq, start, length, volume) {
    var osc, gain, now;
    if (!audioCtx) return;
    try {
      now = audioCtx.currentTime + start;
      osc = audioCtx.createOscillator();
      gain = audioCtx.createGain();
      osc.type = "square";
      osc.frequency.setValueAtTime(freq, now);
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.linearRampToValueAtTime(volume, now + 0.008);
      gain.gain.linearRampToValueAtTime(0.0001, now + length);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + length + 0.01);
    } catch (e) {}
  }

  function signal(kind) {
    if (!ensureAudio()) return;
    if (kind === "work") {
      tone(720, 0.00, 0.10, 0.32);
      tone(980, 0.12, 0.10, 0.32);
      tone(1320, 0.24, 0.12, 0.34);
    } else if (kind === "rest") {
      tone(620, 0.00, 0.13, 0.30);
      tone(430, 0.16, 0.15, 0.32);
    } else if (kind === "warm") {
      tone(1050, 0.00, 0.28, 0.38);
    } else if (kind === "done") {
      tone(1050, 0.00, 0.12, 0.34);
      tone(760, 0.15, 0.16, 0.34);
      tone(1050, 0.36, 0.20, 0.38);
    }
  }

  function phaseData() {
    if (phaseIndex === 0) return { name: "WARM UP", ms: settings.warm, sound: "warm" };
    if (phaseIndex === 1) return { name: "WORK " + roundIndex + "/" + settings.rounds, ms: settings.work, sound: "work" };
    return { name: "REST " + roundIndex + "/" + settings.rounds, ms: settings.rest, sound: "rest" };
  }

  /* Skip zero-length phases so no zero-duration loop can occur. */
  function advanceToUsablePhase(playSound) {
    var p;
    while (true) {
      if (phaseIndex === 0 && settings.warm <= 0) {
        phaseIndex = 1;
        continue;
      }
      if (phaseIndex === 1 && settings.work <= 0) {
        if (roundIndex >= settings.rounds) { finish(); return false; }
        if (settings.rest > 0) { phaseIndex = 2; continue; }
        roundIndex += 1;
        phaseIndex = 1;
        continue;
      }
      if (phaseIndex === 2 && settings.rest <= 0) {
        roundIndex += 1;
        phaseIndex = 1;
        continue;
      }
      break;
    }

    p = phaseData();
    phase.textContent = p.name;
    phaseTotalMs = p.ms;
    remainingMs = p.ms;
    updateDisplay();
    if (playSound) signal(p.sound);
    return true;
  }

  function updateDisplay() {
    var sec = Math.max(0, Math.ceil(remainingMs / 1000));
    var m = Math.floor(sec / 60), s = sec % 60;
    var mm = m < 10 ? "0" + m : "" + m;
    var ss = s < 10 ? "0" + s : "" + s;
    var pct = phaseTotalMs ? (1 - remainingMs / phaseTotalMs) * 100 : 0;
    clock.textContent = mm + ":" + ss;
    progress.style.width = Math.max(0, Math.min(100, pct)) + "%";
  }

  function tick() {
    var now;
    if (!running || paused) return;
    now = Date.now();
    if (!lastTick) lastTick = now;
    remainingMs -= now - lastTick;
    lastTick = now;

    if (remainingMs <= 0) {
      remainingMs = 0;
      updateDisplay();
      if (phaseIndex === 0) {
        phaseIndex = 1;
      } else if (phaseIndex === 1) {
        if (roundIndex >= settings.rounds) { finish(); return; }
        phaseIndex = settings.rest > 0 ? 2 : 1;
        if (phaseIndex === 1) roundIndex += 1;
      } else {
        roundIndex += 1;
        phaseIndex = 1;
      }
      if (!advanceToUsablePhase(true)) return;
    }
    updateDisplay();
    timerId = setTimeout(tick, 100);
  }

  function start() {
    settings = readSettings();
    if (settings.rounds < 1) {
      return;
    }
    ensureAudio();
    setup.className = "screen";
    timer.className = "screen active";
    running = true;
    paused = false;
    phaseIndex = settings.warm > 0 ? 0 : 1;
    roundIndex = 1;
    lastTick = 0;
    clock.className = "";
    status.textContent = "TAP CENTRE = PAUSE";
    if (settings.work <= 0) {
      finish();
      return;
    }
    if (!advanceToUsablePhase(true)) return;
    timerId = setTimeout(tick, 100);
  }

  function finish() {
    running = false;
    paused = false;
    if (timerId) clearTimeout(timerId);
    timerId = null;
    remainingMs = 0;
    phaseTotalMs = 0;
    clock.className = "";
    updateDisplay();
    phase.textContent = "DONE";
    status.textContent = "WORKOUT COMPLETE";
    signal("done");
  }

  function togglePause() {
    if (!running) return;
    paused = !paused;
    clock.className = paused ? "paused" : "";
    status.textContent = paused ? "PAUSED — TAP CENTRE = RESUME" : "TAP CENTRE = PAUSE";
    if (paused) {
      if (timerId) clearTimeout(timerId);
      timerId = null;
    } else {
      ensureAudio();
      lastTick = Date.now();
      timerId = setTimeout(tick, 100);
    }
  }

  function reset() {
    running = false;
    paused = false;
    if (timerId) clearTimeout(timerId);
    timerId = null;
    timer.className = "screen";
    setup.className = "screen active";
  }

  $("startBtn").onclick = start;
  $("clockZone").onclick = togglePause;

  var ids = ["wuM", "wuS", "workM", "workS", "restM", "restS", "rounds"];
  ids.forEach(function(id) {
    $(id).onchange = function() {
      try { localStorage.setItem("cyber_" + id, $(id).value); } catch (e) {}
    };
    try {
      var saved = localStorage.getItem("cyber_" + id);
      if (saved !== null && $(id).querySelector('option[value="' + saved + '"]')) $(id).value = saved;
    } catch (e) {}
  });

  /* Register only a local service worker; failure must never block the timer. */
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function() {
      try { navigator.serviceWorker.register("./sw.js"); } catch (e) {}
    });
  }
})();
</script>
</body>
</html>
